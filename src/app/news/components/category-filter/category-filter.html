<label for="news-category">Category</label>
<select
  #categorySelect
  id="news-category"
  (change)="onCategoryChange(categorySelect.value)"
>
  @for (category of categories; track category.value) {
    <option [value]="category.value" [selected]="category.value === selectedCategory()">
      {{ category.value === selectedCategory() ? '✓ ' : '' }}{{ category.label }}
    </option>
  }
</select>
