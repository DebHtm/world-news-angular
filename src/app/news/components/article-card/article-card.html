<article class="article-card">
  @if (article.urlToImage) {
    <img class="article-image" [src]="article.urlToImage" [alt]="article.title" />
  }

  <div class="article-body">
    <h3>{{ article.title }}</h3>

    @if (article.description) {
      <p class="article-description">{{ article.description }}</p>
    }

    <div class="article-meta">
      <span>{{ article.source.name }}</span>
      <time [attr.datetime]="article.publishedAt">
        {{ article.publishedAt | date: 'mediumDate' }}
      </time>
    </div>
    <a
      class="details-link"
      routerLink="/article"
      [queryParams]="{ url: article.url }"
      queryParamsHandling="merge"
      (click)="saveArticle()"
      >View details <span aria-hidden="true">→</span></a
    >
  </div>
</article>
